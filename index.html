<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Block Reaction is an independent studio for consulting and art production, based in Brooklyn and Milan.">
    <link rel="canonical" href="https://blockreaction.nyc/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Block Reaction">
    <meta property="og:title" content="Block Reaction — Brooklyn &amp; Milan">
    <meta property="og:description" content="Independent studio for consulting and art production.">
    <meta property="og:url" content="https://blockreaction.nyc/">
    <meta property="og:image" content="https://blockreaction.nyc/assets/share/block-reaction-share.png">
    <meta property="og:image:secure_url" content="https://blockreaction.nyc/assets/share/block-reaction-share.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Block Reaction — Brooklyn &amp; Milan">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Block Reaction — Brooklyn &amp; Milan">
    <meta name="twitter:description" content="Independent studio for consulting and art production.">
    <meta name="twitter:image" content="https://blockreaction.nyc/assets/share/block-reaction-share.png">
    <meta name="twitter:image:alt" content="Block Reaction — Brooklyn &amp; Milan">

    <title>Block Reaction — Brooklyn &amp; Milan</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./assets/site.css">
  </head>
  <body>
    <button class="theme-toggle" type="button" aria-label="Use dark mode">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.4 15.1A8.5 8.5 0 0 1 8.9 3.6a8.5 8.5 0 1 0 11.5 11.5Z"></path>
      </svg>
    </button>

    <main>
      <h1 class="logo">
        <span>Block</span>
        <span>Reaction</span>
      </h1>

      <div class="details">
        <p class="studio-meta">
          <span>Milan &amp; Brooklyn</span>
          <span>Established 2018</span>
        </p>
        <p class="contact">
          <span>Contact:</span>
          <span aria-label="info at blockreaction dot nyc">
            info <span aria-hidden="true">ꓮТ</span><span class="sr-only"> at </span>
            blockreaction <span aria-hidden="true">DՕТ</span><span class="sr-only"> dot </span> nyc
          </span>
        </p>
      </div>
    </main>

    <script>
      const root = document.documentElement;
      const toggle = document.querySelector('.theme-toggle');
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');

      function activeTheme() {
        return root.dataset.theme || (systemTheme.matches ? 'dark' : 'light');
      }

      function updateToggle() {
        const isDark = activeTheme() === 'dark';
        toggle.setAttribute('aria-label', `Use ${isDark ? 'light' : 'dark'} mode`);
        toggle.setAttribute('aria-pressed', String(isDark));
      }

      toggle.addEventListener('click', () => {
        root.dataset.theme = activeTheme() === 'dark' ? 'light' : 'dark';
        updateToggle();
      });

      systemTheme.addEventListener('change', updateToggle);
      updateToggle();
    </script>
  </body>
</html>
